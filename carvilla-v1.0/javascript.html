<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="textForm">
        <label for=TextInput>Enter Text</label>
        <input type="Text" id="TextInput" name="TextInput">
        <button type="button" id="convertButton">Convert To Uppercase</button>
    </form>
    <script>
    document.getElementById('convertButton').addEventListener('click', function(){
    const TextInput = document.getElementById('TextInput');
    const inputValue = TextInput.value;

    if (inputValue === inputValue.toLowercase()){
        TextInput.value = inputValue.toUppercase();
        alert("Text has been Converted to Uppercase");
    }
    else{
        alert("Text is Already in Uppercase");
    }
    });
    </script> 
</body>
</html>
